# docker compose up -d --wait
services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  postgres-warehouse:
    image: postgres:17
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "warehouse"]
      interval: 1s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:53306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: app
    healthcheck:
      # Over TCP, so the check fails while the first start still runs without networking.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmysql"]
      interval: 1s
      timeout: 3s
      retries: 60

